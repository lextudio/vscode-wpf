name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: dotnet test src/XamlLanguageServer.Wpf.Tests/XamlLanguageServer.Wpf.Tests.csproj --logger "console;verbosity=normal"

  package:
    name: Package (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            rid: win-x64
            platformTarget: x64
            os: windows-latest
          - target: win32-arm64
            rid: win-arm64
            platformTarget: ARM64
            os: windows-11-arm
          - target: darwin-arm64
            rid: osx-arm64
            platformTarget: ''
            os: macos-latest
          - target: darwin-x64
            rid: osx-x64
            platformTarget: ''
            os: macos-13
          - target: linux-x64
            rid: linux-x64
            platformTarget: ''
            os: ubuntu-latest
          - target: linux-arm64
            rid: linux-arm64
            platformTarget: ''
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Package VSIX
        shell: pwsh
        run: ./dist.all.ps1 -Target ${{ matrix.target }} -RuntimeIdentifier '${{ matrix.rid }}' -PlatformTarget '${{ matrix.platformTarget }}'

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'
          if-no-files-found: error

  publish:
    name: Publish to Marketplace
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish to VS Code Marketplace
        run: npx "@vscode/vsce" publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
